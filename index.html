<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K-TUNES Scoreboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161f30;
            --accent-glow: #ff007f;
            --accent-alt: #00d2ff;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 1rem 0.75rem 2rem 0.75rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Floating Musical Notes Background */
        .notes-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.12;
            pointer-events: none;
        }

        .note {
            position: absolute;
            color: var(--text-sub);
            font-size: 1.5rem;
            animation: floatNotes 10s linear infinite;
            bottom: -40px;
        }

        @keyframes floatNotes {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .note:nth-child(1) { left: 8%; animation-delay: 0s; }
        .note:nth-child(2) { left: 28%; animation-delay: 2s; font-size: 2.2rem; }
        .note:nth-child(3) { left: 55%; animation-delay: 4s; }
        .note:nth-child(4) { left: 78%; animation-delay: 1.5s; font-size: 2rem; }

        .app-container { width: 100%; max-width: 600px; margin: 0 auto; }

        h1.main-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--accent-glow);
            text-shadow: 0 0 15px var(--accent-glow);
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 1.25rem;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* LOGIN SCREEN STYLES */
        .login-card {
            background: rgba(22, 31, 48, 0.9);
            backdrop-filter: blur(10px);
            padding: 2rem 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }

        .login-card h2 {
            text-align: center;
            color: var(--accent-alt);
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .login-input {
            width: 100%;
            background: #0e1626;
            border: 1px solid #2d3748;
            color: var(--text-main);
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
        }

        .login-input:focus { border-color: var(--accent-alt); }

        .login-btn {
            background: linear-gradient(90deg, var(--accent-glow), #7928ca);
            color: #fff;
            border: none;
            padding: 0.9rem;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .error-msg {
            color: #f85149;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }

        /* PROTECTED APP CONTENT STYLES */
        #appContent { display: none; }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid #f85149;
            color: #f85149;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .admin-panel {
            background: rgba(22, 31, 48, 0.8);
            backdrop-filter: blur(10px);
            padding: 0.85rem;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 1.25rem;
            display: flex;
            gap: 0.5rem;
        }

        input[type="text"] {
            flex-grow: 1;
            background: #0e1626;
            border: 1px solid #2d3748;
            color: var(--text-main);
            padding: 0.75rem 0.85rem;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
        }

        button.main-btn {
            background: var(--accent-alt);
            color: #0b0f19;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .winner-podium {
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.18), rgba(0, 210, 255, 0.18));
            border: 2px solid var(--accent-glow);
            border-radius: 14px;
            padding: 1rem;
            margin-bottom: 1.25rem;
            text-align: center;
            display: none;
        }

        .podium-title { color: var(--accent-glow); font-size: 0.85rem; font-weight: 800; text-transform: uppercase; }
        .winner-names { font-size: 1.6rem; font-weight: 900; color: #fff; }
        .winner-score { font-size: 0.9rem; color: var(--accent-alt); margin-top: 0.2rem; font-weight: 700; }

        .download-banner-btn {
            background: linear-gradient(90deg, #ff007f, #7928ca);
            color: #fff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 800;
            margin-top: 0.85rem;
            cursor: pointer;
        }

        .performers-list { display: flex; flex-direction: column; gap: 0.85rem; }
        .performer-card { background: var(--card-bg); border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.08); overflow: hidden; }
        .card-header { padding: 0.85rem 1rem; display: flex; align-items: center; justify-content: space-between; }
        .left-info { display: flex; align-items: center; gap: 0.75rem; }
        .rank-badge { font-size: 1.1rem; font-weight: 800; width: 24px; text-align: center; }
        .performer-name { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
        .right-info { display: flex; align-items: center; gap: 0.85rem; }
        .total-score-badge { background: rgba(0, 210, 255, 0.1); color: var(--accent-alt); padding: 0.35rem 0.75rem; border-radius: 8px; font-weight: 800; font-size: 1.1rem; }
        .btn-toggle-rounds { background: #25334d; color: var(--text-main); border: none; padding: 0.4rem 0.65rem; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .btn-delete { background: transparent; color: #f85149; border: none; font-size: 1.3rem; padding: 0 0.25rem; cursor: pointer; }

        .rounds-drawer { display: none; padding: 1rem 0.85rem; background: #0e1626; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .rounds-drawer.open { display: block; }
        .drawer-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-sub); margin-bottom: 0.75rem; }
        .rounds-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; }
        .round-box { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
        .round-label { font-size: 0.65rem; color: var(--text-sub); font-weight: 700; }
        .round-input { width: 100%; height: 38px; background: #161f30; border: 1px solid #2d3748; color: #fff; text-align: center; border-radius: 8px; font-size: 0.95rem; font-weight: 700; outline: none; }

        #bannerCanvas { display: none; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>

        <div class="note">&#9835;</div>
        <div class="note">&#9833;</div>
        <div class="note">&#9834;</div>
        <div class="note">&#9836;</div>
    </div>

    <div class="app-container">
        <h1 class="main-title">K-TUNES</h1>
        <p class="subtitle">20-Round Leaderboard</p>

        <div id="loginScreen" class="login-card">

            <div id="errorMsg" class="error-msg"></div>
            <input type="email" id="loginEmail" class="login-input" placeholder="Email Address" required>
            <input type="password" id="loginPassword" class="login-input" placeholder="Password" required>
            <button class="login-btn" onclick="handleLogin()">Log In</button>
        </div>
